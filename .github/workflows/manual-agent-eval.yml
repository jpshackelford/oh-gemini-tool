name: Agent Evals (manual)

# Opt-in suites that are not part of regular CI:
#
#   agent_eval       - runs a real LLM agent equipped with the gemini_delegate tool
#                      against natural-language instructions. Non-deterministic and
#                      costs money.
#   agy_integration  - shells out to a real, authenticated `agy` binary. Requires
#                      Antigravity to be installed and logged in on the runner, so
#                      it only works on a self-hosted runner you have prepared.
#
# Both are excluded from the default pytest run; trigger them manually.
on:
  workflow_dispatch:
    inputs:
      suite:
        description: "Which opt-in suite to run"
        required: true
        default: "agent_eval"
        type: choice
        options:
          - agent_eval
          - agy_integration
      pytest_filter:
        description: "Optional pytest -k expression to run a subset"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  opt-in-suite:
    name: Opt-in suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Create virtual environment
        run: uv venv

      - name: Install dependencies
        run: uv pip install -e ".[dev,openhands]"

      - name: Run ${{ inputs.suite }}
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          OPENHANDS_SUPPRESS_BANNER: "1"
        run: |
          uv run pytest tests -m ${{ inputs.suite }} --no-cov -p no:cacheprovider \
            ${{ inputs.pytest_filter && format('-k "{0}"', inputs.pytest_filter) || '' }}
