[project]
name = "oh-gemini-tool"
version = "0.1.0"
description = "OpenHands tool for delegating agent work to the Google Antigravity CLI (agy)"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [
    {name = "JP Shackelford"}
]
keywords = ["openhands", "ai-agent", "tool", "gemini", "antigravity", "agy", "acp"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
]

# The core client (`oh_gemini_tool.agy`) drives the Antigravity CLI through the
# standard library only, so it has no runtime dependencies at all.
dependencies = []

[project.optional-dependencies]
# The OpenHands agent tool integration (`oh_gemini_tool.tool`). openhands-sdk
# requires Python >=3.12, so this extra is only installable there.
openhands = [
    "openhands-sdk>=1.49,<1.56",
    "pydantic>=2.0.0",
    "rich>=13.0.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.8.0",
]

[project.urls]
Homepage = "https://github.com/jpshackelford/oh-gemini-tool"
Repository = "https://github.com/jpshackelford/oh-gemini-tool"
Issues = "https://github.com/jpshackelford/oh-gemini-tool/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/oh_gemini_tool"]

# Ruff configuration
[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "PTH", # flake8-use-pathlib
    "SIM", # flake8-simplify
    "RET", # flake8-return
    "ARG", # flake8-unused-arguments
]

ignore = [
    "E501",  # line too long (handled by formatter)
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "ARG001",  # unused function argument (fixtures)
    "S101",    # use of assert
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "agent_eval: end-to-end LLM agent evals (manual, cost money, need LLM_API_KEY)",
    "agy_integration: exercises the real agy binary (manual, needs an authenticated agy)",
]
# Exclude opt-in suites from the default run; enable with `-m agent_eval` /
# `-m agy_integration`.
addopts = [
    "-v",
    "--strict-markers",
    "--tb=short",
    "-m",
    "not agent_eval and not agy_integration",
]

[tool.coverage.run]
source = ["src"]
omit = ["tests/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
